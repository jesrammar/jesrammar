<svg xmlns="http://www.w3.org/2000/svg" width="960" height="577" viewBox="0 0 960 577" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura modular de EnterpriseIQ</title><desc id="desc">React consume por REST y JWT un único backend Spring Boot con módulos internos. El backend persiste en PostgreSQL y un volumen de ficheros. Actuator expone métricas para Prometheus, Grafana y Alertmanager.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#10253A"/><stop offset=".55" stop-color="#0B1221"/><stop offset="1" stop-color="#17132C"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#53E4EA"/><stop offset="1" stop-color="#B1A0FF"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#2CCBD3" stop-opacity=".19"/><stop offset="1" stop-color="#2CCBD3" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7188AA" stroke-opacity=".07"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#53E4EA" stroke-width="1.5"/></marker>
</defs>
<rect x="1" y="1" width="958" height="575" rx="20" fill="url(#surface)" stroke="#26364C"/>
<rect x="2" y="2" width="956" height="573" rx="20" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="38" y="40" fill="#53E4EA" font-size="14" font-weight="600" letter-spacing="2">ENTERPRISEIQ / ARQUITECTURA</text><text x="38" y="83" fill="#F3F7FD" font-size="26" font-weight="600" >Un backend. Módulos con responsabilidades claras.</text><rect x="38" y="123" width="220" height="101" rx="14" fill="#101A2B" stroke="#26364C"/><text x="57" y="151" fill="#B1A0FF" font-size="14" font-weight="600" letter-spacing="2">INTERFAZ</text><text x="57" y="184" fill="#F3F7FD" font-size="21" font-weight="600" >React + TypeScript</text><text x="57" y="209" fill="#A2B4CB" font-size="16" font-weight="400" >SPA · Vite</text><path d="M258 173H351" fill="none" stroke="#53E4EA" stroke-width="2" marker-end="url(#arrow)"/><text x="304" y="156" fill="#53E4EA" font-size="13" font-weight="400" text-anchor="middle">REST / JWT</text><rect x="362" y="115" width="560" height="257" rx="14" fill="#101E2E" stroke="#3B6579"/><text x="384" y="144" fill="#53E4EA" font-size="14" font-weight="600" letter-spacing="2">SPRING BOOT / MONOLITO MODULAR</text><text x="384" y="175" fill="#F3F7FD" font-size="21" font-weight="600" >Seguridad por rol y empresa · API REST</text><rect x="384" y="202" width="160" height="52" rx="9" fill="#14273A" stroke="#2D4B62"/><text x="464" y="234" fill="#F3F7FD" font-size="17" font-weight="500" text-anchor="middle">Ingesta</text><rect x="558" y="202" width="160" height="52" rx="9" fill="#14273A" stroke="#2D4B62"/><text x="638" y="234" fill="#F3F7FD" font-size="17" font-weight="500" text-anchor="middle">Análisis</text><rect x="732" y="202" width="160" height="52" rx="9" fill="#14273A" stroke="#2D4B62"/><text x="812" y="234" fill="#F3F7FD" font-size="17" font-weight="500" text-anchor="middle">Informes</text><rect x="384" y="271" width="241" height="52" rx="9" fill="#14273A" stroke="#2D4B62"/><text x="504.5" y="303" fill="#F3F7FD" font-size="17" font-weight="500" text-anchor="middle">Automatización</text><rect x="647" y="271" width="241" height="52" rx="9" fill="#14273A" stroke="#2D4B62"/><text x="767.5" y="303" fill="#F3F7FD" font-size="17" font-weight="500" text-anchor="middle">Auditoría</text><text x="384" y="353" fill="#A2B4CB" font-size="15" font-weight="400" >Módulos dentro del mismo proceso Java</text><path d="M499 372V406" fill="none" stroke="#53E4EA" stroke-width="2" marker-end="url(#arrow)"/><path d="M786 372V406" fill="none" stroke="#53E4EA" stroke-width="2" marker-end="url(#arrow)"/><rect x="362" y="418" width="271" height="86" rx="14" fill="#101A2B" stroke="#26364C"/><text x="382" y="450" fill="#F3F7FD" font-size="21" font-weight="600" >PostgreSQL + Flyway</text><text x="382" y="478" fill="#A2B4CB" font-size="16" font-weight="400" >Estado y migraciones</text><rect x="650" y="418" width="272" height="86" rx="14" fill="#101A2B" stroke="#26364C"/><text x="670" y="450" fill="#F3F7FD" font-size="21" font-weight="600" >Volumen persistente</text><text x="670" y="478" fill="#A2B4CB" font-size="16" font-weight="400" >Ficheros e informes</text><rect x="38" y="275" width="265" height="229" rx="14" fill="#0F192C" stroke="#4A466B"/><text x="57" y="305" fill="#B1A0FF" font-size="14" font-weight="600" letter-spacing="2">OBSERVABILIDAD</text><text x="57" y="342" fill="#F3F7FD" font-size="18" font-weight="500" >Actuator → Prometheus</text><text x="57" y="383" fill="#F3F7FD" font-size="22" font-weight="600" >Grafana</text><text x="57" y="411" fill="#A2B4CB" font-size="16" font-weight="400" >Dashboards</text><text x="57" y="448" fill="#F3F7FD" font-size="22" font-weight="600" >Alertmanager</text><text x="57" y="476" fill="#A2B4CB" font-size="16" font-weight="400" >Gestión de alertas</text><path d="M362 247H329V344H303" fill="none" stroke="#B1A0FF" stroke-width="2" stroke-dasharray="5 5"/><text x="57" y="548" fill="#A2B4CB" font-size="17" font-weight="400" >Despliegue con Docker Compose · servicios de observabilidad separados del backend</text></g></svg>
